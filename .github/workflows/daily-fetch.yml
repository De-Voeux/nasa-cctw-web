name: Daily data top-up

# Every day at 19:00 WIB (12:00 UTC): the newest published day of each source (MUR SST, GPM IMERG,
# Copernicus Marine analysis, NASA POWER), one day per source, for the same 48 zones as the approved
# plan, upserted into seagis_daily_metrics. A source with no day newer than the database is skipped.
# Script: data/seagis-nasa-extractor/scripts/daily_latest.py.
#
# The job refuses to download unless SEAGIS_PLAN_SHA256 equals the hash of the committed
# outputs/plan.json, and refuses to write unless SEAGIS_DB_HOST equals the host in SEAGIS_DB_DSN.
#
# Repository secrets:   EARTHDATA_TOKEN, COPERNICUSMARINE_SERVICE_USERNAME,
#                       COPERNICUSMARINE_SERVICE_PASSWORD, SEAGIS_DB_DSN
# Repository variables: SEAGIS_PLAN_SHA256 (the reviewed plan hash), SEAGIS_DB_HOST

on:
  schedule:
    - cron: "0 12 * * *"      # 19:00 WIB
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only pick the days and list the work; download and write nothing"
        type: boolean
        default: true
      today:
        description: "Run as if today (WIB) were YYYY-MM-DD; empty = now"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  top-up:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: data/seagis-nasa-extractor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/seagis-nasa-extractor/pyproject.toml

      - name: Install
        run: pip install -e '.[fetch,db]' shapely

      - name: Fetch and load the newest day
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          SEAGIS_DB_DSN: ${{ secrets.SEAGIS_DB_DSN }}
          PLAN_SHA: ${{ vars.SEAGIS_PLAN_SHA256 }}
          DB_HOST: ${{ vars.SEAGIS_DB_HOST }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          TODAY: ${{ inputs.today }}
        run: |
          set -o pipefail
          args=(--approve-plan "$PLAN_SHA" --confirm-host "$DB_HOST")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ -n "$TODAY" ] && args+=(--today "$TODAY")
          python scripts/daily_latest.py "${args[@]}" 2>&1 | tee daily.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-log-${{ github.run_id }}
          path: |
            data/seagis-nasa-extractor/daily.log
            data/seagis-nasa-extractor/outputs/daily/*/fetch_manifest.jsonl
          retention-days: 14
          if-no-files-found: ignore

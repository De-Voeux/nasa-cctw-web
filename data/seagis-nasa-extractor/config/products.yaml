# Candidate products, resolved by `seagis-extract catalog` against NASA CMR (metadata only).
# Facts (IDs, units, fills, coverage, sizes) are written to outputs/catalog.json, not here.
# See docs/CATALOG_REVIEW.md. Chlorophyll-a is out of scope (decision 2026-11-15).

mur_sst:
  role: primary
  short_name: MUR-JPL-L4-GLOB-v4.1
  granule_pattern: "*-JPL-L4_GHRSST-SSTfnd-MUR-GLOB-v02.0-fv04.1"
  variables: [analysed_sst, analysis_error, mask, sea_ice_fraction]
  harmony_service: sds/HOSS-geographic   # bbox / shape / temporal / variable subset -> NetCDF-4


# Copernicus Marine (CMEMS) analysis-forecast datasets, added 2026-11-15 at the user's request.
# Read through the public ARCO "geoChunked" Zarr store; exact transfer = sum of intersecting chunks.
copernicus:
  - key: cmems_bgc_nut
    product_id: GLOBAL_ANALYSISFORECAST_BGC_001_028
    dataset_id: cmems_mod_glo_bgc-nut_anfc_0.25deg_P1D-m_202311
    variables: [no3, po4]
    depth: surface
    static_mask: {dataset_id: cmems_mod_glo_bgc_anfc_0.25deg_static_202311--ext--mask}   # 1 = sea, 0 = land
  - key: cmems_bgc_car
    product_id: GLOBAL_ANALYSISFORECAST_BGC_001_028
    dataset_id: cmems_mod_glo_bgc-car_anfc_0.25deg_P1D-m_202311
    variables: [ph]
    depth: surface
    static_mask: {dataset_id: cmems_mod_glo_bgc_anfc_0.25deg_static_202311--ext--mask}
  - key: cmems_phy_so
    product_id: GLOBAL_ANALYSISFORECAST_PHY_001_024
    dataset_id: cmems_mod_glo_phy-so_anfc_0.083deg_P1D-m_202406
    variables: [so]
    depth: surface
    static_mask: {dataset_id: cmems_mod_glo_phy_anfc_0.083deg_static_202211--ext--bathy}
  - key: cmems_phy_thetao
    product_id: GLOBAL_ANALYSISFORECAST_PHY_001_024
    dataset_id: cmems_mod_glo_phy-thetao_anfc_0.083deg_P1D-m_202406
    variables: [thetao]
    depth: surface
    forecast_only: true
    static_mask: {dataset_id: cmems_mod_glo_phy_anfc_0.083deg_static_202211--ext--bathy}
  # Ocean currents, added 2026-11-15. current_speed / current_direction / current_steadiness are
  # derived per zone and day from uo + vo (see process.current_stats). Same grid and mask as salinity.
  - key: cmems_phy_cur
    product_id: GLOBAL_ANALYSISFORECAST_PHY_001_024
    dataset_id: cmems_mod_glo_phy-cur_anfc_0.083deg_P1D-m_202406
    variables: [uo, vo]
    depth: surface
    static_mask: {dataset_id: cmems_mod_glo_phy_anfc_0.083deg_static_202211--ext--bathy}

# Rainfall, added 2026-11-15. GPM IMERG Late Run daily V07 (GES DISC), via Harmony like MUR.
# Late, not Final: Final (GPM_3IMERGDF) lags ~3.5 months and does not reach this period.
imerg:
  short_name: GPM_3IMERGDL
  version: '07'
  concept_id: C2723754859-GES_DISC
  granule_pattern: "3B-DAY-L.MS.MRG.3IMERG.*.V07*"
  # randomError dropped 2026-11-15: the daily values are ~50-75x precipitation (2.76 on dry days), so they are
  # not an mm/day error on the same scale (likely variance-like); not used, rather than mis-read.
  variables: [precipitation]
  harmony_service: sds/HOSS-geographic

# Weather at each zone, added 2026-11-15. NASA LaRC POWER daily point API (no account).
# One point per zone: the zone polygon's representative point (always inside the zone, at sea).
power:
  endpoint: https://power.larc.nasa.gov/api/temporal/daily/point
  community: AG
  parameters: [T2M, RH2M, WS10M, WD10M, ALLSKY_SFC_SW_DWN, ALLSKY_SFC_PAR_TOT, CLOUD_AMT]

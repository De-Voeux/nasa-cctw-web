<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050914" />
    <title>SEAmon — Coastal environmental risk atlas</title>
    <meta name="description" content="SEAmon is a proposed coastal environmental risk atlas for seaweed aquaculture." />

    <meta property="og:site_name" content="SEAmon" />
    <meta property="og:title" content="SEAmon — Coastal environmental risk atlas" />
    <meta property="og:description" content="SEAmon is a proposed coastal environmental risk atlas for seaweed aquaculture." />
    <meta property="og:url" content="https://seamon.seagis.app/" />
    <meta property="og:image" content="https://seamon.seagis.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="457" />
    <meta property="og:image:alt" content="SEAmon, made for NASA: a seaweed illustration on a dark blue background." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SEAmon — Coastal environmental risk atlas" />
    <meta name="twitter:description" content="SEAmon is a proposed coastal environmental risk atlas for seaweed aquaculture." />
    <meta name="twitter:image" content="https://seamon.seagis.app/og-image.png" />
    <meta name="twitter:image:alt" content="SEAmon, made for NASA: a seaweed illustration on a dark blue background." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/dashboard.css" />
  </head>
  <body>
    <div id="globe" class="globe" aria-hidden="true"></div>
    <div id="overlay" class="overlay"></div>

    <!-- Date pills (top left) -->
    <nav class="glass date-bar" aria-label="Date">
      <div id="dates" class="date-pills" role="group"></div>
    </nav>

    <!-- Map controls (right of the globe, left of the panel) -->
    <div class="map-controls">
      <button id="layers-btn" class="glass round-btn" aria-label="Layers" aria-expanded="false" aria-controls="layers-menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z" /><path d="m3 13 9 5 9-5" /></svg>
      </button>
      <div id="layers-menu" class="glass layers-menu" hidden></div>
      <div class="glass zoom-pill" role="group" aria-label="Zoom">
        <button id="zoom-in" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></button>
        <button id="zoom-out" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg></button>
        <button id="zoom-home" aria-label="Back to Southeast Asia"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /></svg></button>
      </div>
    </div>

    <!-- Side panel (right) -->
    <aside class="glass side-panel" aria-label="Locations">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="search" type="search" placeholder="Search country, island, or region" autocomplete="off" />
      </label>
      <div id="panel-body" class="panel-body" aria-live="polite"></div>
    </aside>

    <!-- Ask bar (bottom left) -->
    <form id="ask" class="ask-bar" autocomplete="off">
      <div class="glass ask-input">
        <svg class="ask-plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <input id="ask-input" type="text" aria-label="Ask about the atlas" placeholder="Which area has the most ice-ice reports?" />
      </div>
      <button class="glass send-btn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 10 14" /><path d="m21 3-7 18-4-7-7-4 18-7Z" /></svg>
      </button>
    </form>

    <p class="credit">Surface: NASA Earth Observatory, Blue Marble Next Generation · Ocean, relief, lights: NASA, via franky-adl/threejs-earth · Locations: unverified research leads</p>

    <script src="./dashboard/main.js" type="module"></script>
  </body>
</html>

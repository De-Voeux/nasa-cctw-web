[project]
name = "seagis-nasa-extractor"
version = "0.0.0"
description = "Resumable extractor for daily regional coastal SST (SEAGIS)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
fetch = ["xarray>=2024.1", "h5netcdf>=1.3", "h5py>=3.10", "copernicusmarine>=2.0", "numpy>=1.26"]

[project.scripts]
seagis-extract = "seagis_extractor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
